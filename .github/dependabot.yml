version: 2
updates:
  # Versions of the GitHub Actions used by the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Compat entries of the Julia projects (Dependabot's Julia support is in beta)
  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/test"
      - "/docs"
      - "/benchmark"
    schedule:
      interval: "weekly"
