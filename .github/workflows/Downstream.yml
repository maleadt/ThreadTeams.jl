name: Downstream
# Runs the tests of packages that use ThreadTeams against this revision of ThreadTeams
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  downstream:
    name: ${{ matrix.package.repo }}@${{ matrix.package.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package:
          - repo: vchuravy/FastBroadcast.jl
            ref: vc/threadteams
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.package.repo }}
          ref: ${{ matrix.package.ref }}
          path: downstream
      - name: Run downstream tests
        shell: julia --color=yes {0}
        env:
          JULIA_NUM_THREADS: '4'
        run: |
          using Pkg, TOML
          # Point the downstream package at this checkout of ThreadTeams, replacing any
          # `[sources]` entry it has for it (e.g. one that tracks ThreadTeams' main branch)
          project_file = joinpath("downstream", "Project.toml")
          project = TOML.parsefile(project_file)
          sources = get!(project, "sources", Dict{String, Any}())
          sources["ThreadTeams"] = Dict("path" => pwd())
          open(io -> TOML.print(io, project), project_file, "w")
          Pkg.activate("downstream")
          Pkg.test()
